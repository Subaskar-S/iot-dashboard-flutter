name: iot_dashboard
description: Production-grade Industrial IoT Dashboard
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.3.0

  # HTTP & WebSocket
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.1

  # Charts
  fl_chart: ^1.2.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3

  # JSON
  json_annotation: ^4.9.0

  # UI utilities
  intl: ^0.20.3
  timeago: ^3.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.4.14
  json_serializable: ^6.9.0
  mockito: ^5.4.5
  build_verify: ^3.1.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# Launcher icons. Drop a 1024x1024 PNG at the path below, then run:
#
#   dart run flutter_launcher_icons
#
# That regenerates every Android density plus the adaptive icon, and the iOS
# app icon set. Until then the app ships the stock Flutter template icon.
# Google Play separately requires a 512x512 store icon uploaded in the console.
flutter_launcher_icons:
  image_path: assets/icons/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
