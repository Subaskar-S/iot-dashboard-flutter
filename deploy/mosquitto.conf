# Mosquitto is reachable only on the internal Docker network (port 1883 is not
# published in docker-compose.yml), so anonymous access is acceptable here.
#
# If you publish 1883 so that real ESP32 / Raspberry Pi devices can connect,
# you MUST disable anonymous access first:
#
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#
# and create the password file with:
#
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd device01

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
