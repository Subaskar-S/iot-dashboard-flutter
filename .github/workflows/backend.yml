name: Backend CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "docs/**"]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          - os: macos-14
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      # ── Install dependencies ───────────────────────────────────────────

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libboost-all-dev \
            nlohmann-json3-dev \
            libspdlog-dev \
            libfmt-dev \
            libssl-dev \
            libsqlite3-dev \
            libpaho-mqtt-dev \
            libgtest-dev \
            libgmock-dev \
            mosquitto

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja boost nlohmann-json spdlog fmt \
            openssl sqlite googletest libpaho-mqtt mosquitto

      # ── Configure ─────────────────────────────────────────────────────

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON

      # ── Build ─────────────────────────────────────────────────────────

      - name: Build
        run: cmake --build build --parallel

      # ── Format check ──────────────────────────────────────────────────

      - name: Check formatting
        run: |
          find src -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format --dry-run -Werror

      # ── Start MQTT broker for integration tests ───────────────────────

      - name: Start Mosquitto (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "listener 1883" | sudo tee /etc/mosquitto/conf.d/ci.conf
          echo "allow_anonymous true" | sudo tee -a /etc/mosquitto/conf.d/ci.conf
          sudo systemctl start mosquitto
          sleep 2

      - name: Start Mosquitto (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p /opt/homebrew/etc/mosquitto
          echo "listener 1883" > /opt/homebrew/etc/mosquitto/mosquitto.conf
          echo "allow_anonymous true" >> /opt/homebrew/etc/mosquitto/mosquitto.conf
          /opt/homebrew/sbin/mosquitto \
            -c /opt/homebrew/etc/mosquitto/mosquitto.conf -d
          sleep 2

      # ── Test ──────────────────────────────────────────────────────────

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --timeout 120

      # ── Upload test results ────────────────────────────────────────────

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/Testing/
          if-no-files-found: ignore
