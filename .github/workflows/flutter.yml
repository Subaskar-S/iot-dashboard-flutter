name: Flutter CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "docs/**"]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "flutter/**"

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze --fatal-warnings

      - name: Run tests
        working-directory: flutter
        run: flutter test --reporter=expanded

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Web
        working-directory: flutter
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: flutter/build/web/
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Android APK (debug)
        working-directory: flutter
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
